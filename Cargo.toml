[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/codegen",
    "crates/metamorphose",
    "crates/transponding",
    "crates/compression",
    "crates/adapters/json",
    "crates/adapters/protobuf",
    "crates/adapters/csv",
    "crates/adapters/arrow",
    "crates/adapters/arrow_ipc",
    "crates/adapters/parquet",
    "crates/benches",
    "crates/schemas/telemetry_core",
    "crates/schemas/measurement_core",
    "crates/schemas/test_compatibility_core",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["MBT contributors"]

[workspace.dependencies]
rkyv = { version = "=0.8.16", features = ["unaligned"] }
